<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AM BEBIDAS - Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --danger: #ef4444; --success: #10b981;
            --bg-body: #f1f5f9; --bg-panel: white; --text-main: #1e293b;
            --text-sub: #64748b; --border: #e2e8f0;
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a; --bg-panel: #1e293b; --text-main: #f8fafc;
            --text-sub: #94a3b8; --border: #334155;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-body); margin: 0; padding: 15px; 
            color: var(--text-main); transition: background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        /* LOGIN SCREEN */
        #login-screen {
            position: fixed; inset: 0; background: var(--bg-body);
            display: flex; align-items: center; justify-content: center; z-index: 20000;
        }
        .login-card {
            background: var(--bg-panel); padding: 30px; border-radius: 30px; 
            text-align: center; max-width: 380px; width: 90%; border: 1px solid var(--border);
        }

        .container { max-width: 100%; margin: auto; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .logo-text { font-size: 22px; font-weight: 800; background: var(--bg-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .theme-toggle { cursor: pointer; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-panel); font-size: 18px; }

        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .card { background: var(--bg-panel); padding: 15px; border-radius: 20px; border: 1px solid var(--border); }
        .card h3 { margin: 0; font-size: 10px; color: var(--text-sub); text-transform: uppercase; }
        .card p { margin: 5px 0 0; font-size: 18px; font-weight: 800; }

        .content-grid { display: flex; flex-direction: column; gap: 20px; }
        .panel { background: var(--bg-panel); padding: 20px; border-radius: 24px; border: 1px solid var(--border); }

        .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 450px; }
        td { padding: 12px 8px; font-size: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }

        .item-brand { display: flex; align-items: center; gap: 10px; }
        .brand-frame { width: 40px; height: 40px; border-radius: 10px; background: white; display: flex; align-items: center; justify-content: center; border: 1px solid #e2e8f0; overflow: hidden; flex-shrink: 0; }
        .brand-img { width: 100%; height: 100%; object-fit: contain; }

        .selector { display: inline-flex; align-items: center; background: var(--bg-body); padding: 4px; border-radius: 12px; }
        .btn-step { width: 36px; height: 36px; border-radius: 10px; border: none; background: var(--bg-panel); color: var(--text-main); font-weight: 800; }
        .btn-step.plus { background: var(--primary); color: white; }
        .val-vendas { min-width: 30px; text-align: center; font-weight: 800; }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 10px 20px; white-space: nowrap; border-radius: 12px; font-size: 14px; border: 1px solid var(--border); background: var(--bg-panel); color: var(--text-sub); font-weight: 700; }
        .tab-btn.active { background: var(--bg-gradient); color: white; border: none; }

        label { display: block; font-size: 10px; font-weight: 800; margin-bottom: 5px; color: var(--text-sub); }
        input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; box-sizing: border-box; margin-bottom: 12px; background: var(--bg-body); color: var(--text-main); font-size: 16px !important; }
        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 12px; color: white; font-weight: 800; cursor: pointer; background: var(--bg-gradient); }

        #alert-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .alert-box { background: var(--bg-panel); padding: 30px; border-radius: 25px; text-align: center; width: 85%; border: 2px solid var(--danger); }

        #modal-busca { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 10001; }
        .busca-box { background: var(--bg-panel); width: 95%; height: 85vh; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; }
        .grid-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; overflow-y: auto; margin-top: 15px; }
        .pix-img { width: 100%; height: 100px; object-fit: contain; border-radius: 12px; border: 2px solid var(--border); background: white; }
        
        .hidden { display: none !important; }
        .admin-only { border: 2px solid var(--primary) !important; }
    </style>
</head>
<body data-theme="dark">

<div id="login-screen">
    <div class="login-card">
        <span style="font-size: 40px;">🍹</span>
        <h2 id="login-title">AM BEBIDAS</h2>
        <div id="box-login">
            <input type="email" id="l-email" placeholder="E-mail">
            <input type="password" id="l-senha" placeholder="Senha">
            <button class="btn-main" onclick="window.logar()">ENTRAR</button>
            <p style="font-size: 12px; margin-top: 20px;">Acesso restrito. <span style="color: var(--primary); font-weight:800" onclick="switchLogin(true)">Solicitar</span></p>
        </div>
        <div id="box-registro" class="hidden">
            <input type="text" id="r-nome" placeholder="Seu Nome">
            <input type="email" id="r-email" placeholder="Seu E-mail">
            <input type="password" id="r-senha" placeholder="Senha">
            <button class="btn-main" style="background: var(--success)" onclick="window.registrar()">SOLICITAR</button>
            <p style="font-size: 12px; margin-top: 20px;" onclick="switchLogin(false)">Voltar</p>
        </div>
    </div>
</div>

<div id="main-app" class="hidden">
    <div id="alert-overlay">
        <div class="alert-box">
            <h2 style="color:var(--danger)">⚠️ ESTOQUE BAIXO</h2>
            <p id="alert-msg"></p>
            <button class="btn-main" onclick="document.getElementById('alert-overlay').style.display='none'">OK</button>
        </div>
    </div>

    <div id="modal-busca">
        <div class="busca-box">
            <h3 style="margin-top:0">🔍 Buscar Imagem</h3>
            <div style="display:flex; gap:10px">
                <input type="text" id="busca-input" style="margin-bottom:0">
                <button onclick="buscarOpenFood()" style="background:var(--primary); color:white; border:none; border-radius:12px; padding:0 15px">IR</button>
            </div>
            <div class="grid-results" id="busca-results"></div>
            <button onclick="fecharBusca()" style="margin-top:15px; padding:12px; background:var(--danger); color:white; border:none; border-radius:12px">CANCELAR</button>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="header-logo">
                <span style="font-size: 24px;">🍹</span>
                <span class="logo-text">AM BEBIDAS</span>
            </div>
            <div style="display:flex; gap:10px">
                <button class="theme-toggle" onclick="toggleTheme()" id="theme-icon">☀️</button>
                <button onclick="window.sair()" style="border:1px solid var(--danger); color:var(--danger); background:none; border-radius:10px; padding:5px 10px; font-size:10px; font-weight:800">SAIR</button>
            </div>
        </header>

        <div id="panel-admin" class="panel admin-only hidden" style="margin-bottom:20px">
            <h3 style="margin-top:0; font-size:14px">🛡️ Aprovações</h3>
            <table style="min-width:100%"><tbody id="lista-usuarios"></tbody></table>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" id="btn-t1" onclick="switchTab('estoque')">📦 Estoque</button>
            <button class="tab-btn" id="btn-t2" onclick="switchTab('vendas')">📊 Finanças</button>
            <button class="tab-btn" id="btn-t3" onclick="switchTab('relatorios')">📅 Relatórios</button>
        </div>

        <div class="dashboard">
            <div class="card"><h3>Estoque</h3><p id="d-est">0</p></div>
            <div class="card"><h3>Vendas</h3><p id="d-ven">0</p></div>
            <div class="card"><h3>Receita</h3><p id="d-fat" style="color:var(--success)">R$ 0</p></div>
            <div class="card"><h3>Lucro</h3><p id="d-luc" style="color:var(--primary)">R$ 0</p></div>
        </div>

        <div id="section-estoque" class="content-grid">
            <div class="panel">
                <h2 id="form-title" style="margin-top:0; font-size:16px">➕ Novo Produto</h2>
                <input type="hidden" id="edit-idx"><input type="hidden" id="p-img-base64"><input type="hidden" id="p-img-url">
                
                <label>NOME DO PRODUTO</label>
                <input type="text" id="p-nome" placeholder="Ex: Coca Cola 350ml">
                
                <div style="display:flex; gap:10px">
                    <div style="flex:1"><label>CUSTO</label><input type="number" id="p-custo"></div>
                    <div style="flex:1"><label>VENDA</label><input type="number" id="p-venda"></div>
                </div>
                
                <div style="display:flex; gap:10px">
                    <div style="flex:1"><label>QTD ATUAL</label><input type="number" id="p-qtd"></div>
                    <div style="flex:1"><label>MIN. ALERTA</label><input type="number" id="p-min" value="5"></div>
                </div>

                <button type="button" onclick="abrirBusca()" style="width:100%; background:#22c55e; border:none; border-radius:12px; color:white; font-weight:800; padding:12px; margin-bottom:12px">🔍 BUSCAR IMAGEM</button>
                <button class="btn-main" onclick="salvar()">SALVAR NO SISTEMA</button>
            </div>

            <div class="panel">
                <h2 style="margin-top:0; font-size:16px">📦 Inventário</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr style="font-size:10px; color:var(--text-sub); text-align: left;">
                                <th>PRODUTO</th>
                                <th>EST.</th>
                                <th>VENDER</th>
                                <th>AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-tabela"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="section-vendas" class="panel hidden">
            <h2 style="font-size:16px">Resumo Financeiro</h2>
            <div class="table-container">
                <table>
                    <thead><tr style="font-size:10px; color:var(--text-sub)"><th>ITEM</th><th>VENDAS</th><th>LUCRO</th></tr></thead>
                    <tbody id="corpo-financeiro"></tbody>
                </table>
            </div>
        </div>

        <div id="section-relatorios" class="panel hidden">
            <h2 style="font-size:16px">Histórico Recente</h2>
            <div class="table-container">
                <table><tbody id="corpo-historico"></tbody></table>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, get, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBhM8n2Z5A1_mJLiUJBLxzDAV6OaSfWuuo",
        authDomain: "am-bebidas-eb3d5.firebaseapp.com",
        databaseURL: "https://am-bebidas-eb3d5-default-rtdb.firebaseio.com",
        projectId: "am-bebidas-eb3d5",
        appId: "1:377784119257:web:68d6c9b362e5162beaf3c8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const MASTER_EMAIL = "daniel44866@gmail.com";
    let produtos = [];

    // --- SEGURANÇA ---
    window.switchLogin = (reg) => {
        document.getElementById('box-login').classList.toggle('hidden', reg);
        document.getElementById('box-registro').classList.toggle('hidden', !reg);
    };

    window.logar = () => {
        const e = document.getElementById('l-email').value, s = document.getElementById('l-senha').value;
        signInWithEmailAndPassword(auth, e, s).catch(() => alert("Acesso Negado"));
    };

    window.registrar = async () => {
        const n = document.getElementById('r-nome').value, e = document.getElementById('r-email').value, s = document.getElementById('r-senha').value;
        try {
            const res = await createUserWithEmailAndPassword(auth, e, s);
            await set(ref(db, 'usuarios/' + res.user.uid), { nome: n, email: e, aprovado: false });
            alert("Solicitado! Aguarde aprovação.");
            window.sair();
        } catch { alert("Erro ao registrar"); }
    };

    window.sair = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const snap = await get(ref(db, 'usuarios/' + user.uid));
            if (user.email === MASTER_EMAIL || (snap.exists() && snap.val().aprovado)) {
                liberarSistema(user.email === MASTER_EMAIL);
            } else {
                alert("Aguarde aprovação"); window.sair();
            }
        } else {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
        }
    });

    function liberarSistema(isAdmin) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        if(isAdmin) {
            document.getElementById('panel-admin').classList.remove('hidden');
            onValue(ref(db, 'usuarios'), snap => {
                const list = document.getElementById('lista-usuarios');
                list.innerHTML = "";
                const users = snap.val();
                for(let id in users) if(!users[id].aprovado) {
                    list.innerHTML += `<tr><td>${users[id].nome}</td><td style="text-align:right">
                        <button onclick="window.admAcao('${id}',true)" style="background:var(--success); color:white; border:none; padding:5px; border-radius:5px">OK</button>
                    </td></tr>`;
                }
            });
        }
        initApp();
    }

    window.admAcao = (uid, aprovar) => update(ref(db, 'usuarios/'+uid), {aprovado:true});

    // --- LÓGICA APP ---
    function initApp() {
        onValue(ref(db, 'produtos'), (snap) => {
            produtos = snap.val() || [];
            renderizar();
        });
    }

    window.abrirBusca = () => {
        document.getElementById('modal-busca').style.display = 'flex';
        const n = document.getElementById('p-nome').value;
        if(n) { document.getElementById('busca-input').value = n; buscarOpenFood(); }
    };

    window.fecharBusca = () => document.getElementById('modal-busca').style.display = 'none';

    window.buscarOpenFood = async () => {
        const q = document.getElementById('busca-input').value;
        const res = await fetch(`https://br.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&json=1&page_size=12`);
        const data = await res.json();
        const grid = document.getElementById('busca-results');
        grid.innerHTML = "";
        data.products.forEach(p => {
            const img = p.image_front_small_url;
            if(img) {
                const el = document.createElement('img');
                el.src = img; el.className = 'pix-img';
                el.onclick = () => {
                    document.getElementById('p-img-url').value = img;
                    fecharBusca();
                };
                grid.appendChild(el);
            }
        });
    };

    window.toggleTheme = () => {
        const b = document.body;
        const n = b.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        b.setAttribute('data-theme', n);
        document.getElementById('theme-icon').innerText = n === 'light' ? '🌙' : '☀️';
    };

    window.switchTab = (aba) => {
        document.getElementById('section-estoque').classList.toggle('hidden', aba !== 'estoque');
        document.getElementById('section-vendas').classList.toggle('hidden', aba !== 'vendas');
        document.getElementById('section-relatorios').classList.toggle('hidden', aba !== 'relatorios');
        document.getElementById('btn-t1').classList.toggle('active', aba === 'estoque');
        document.getElementById('btn-t2').classList.toggle('active', aba === 'vendas');
        document.getElementById('btn-t3').classList.toggle('active', aba === 'relatorios');
    };

    window.salvar = () => {
        const idx = document.getElementById('edit-idx').value;
        const item = {
            nome: document.getElementById('p-nome').value,
            custo: parseFloat(document.getElementById('p-custo').value) || 0,
            venda: parseFloat(document.getElementById('p-venda').value) || 0,
            qtd: parseInt(document.getElementById('p-qtd').value) || 0,
            min: parseInt(document.getElementById('p-min').value) || 5,
            logo: document.getElementById('p-img-url').value || "https://ui-avatars.com/api/?name=Prod",
            vendidos: (idx === "") ? 0 : (produtos[idx].vendidos || 0)
        };
        if (idx === "") produtos.push(item); else produtos[idx] = item;
        set(ref(db, 'produtos'), produtos).then(() => location.reload());
    };

    window.ajustar = (idx, op) => {
        if(op === '+') {
            if(produtos[idx].qtd > 0) {
                produtos[idx].qtd--;
                produtos[idx].vendidos = (produtos[idx].vendidos || 0) + 1;
                if(produtos[idx].qtd <= produtos[idx].min) {
                    document.getElementById('alert-msg').innerText = `${produtos[idx].nome} está acabando!`;
                    document.getElementById('alert-overlay').style.display = 'flex';
                }
            }
        } else if(produtos[idx].vendidos > 0) {
            produtos[idx].qtd++;
            produtos[idx].vendidos--;
        }
        update(ref(db, 'produtos/' + idx), produtos[idx]);
    };

    function renderizar() {
        const tbE = document.getElementById('corpo-tabela');
        const tbF = document.getElementById('corpo-financeiro');
        tbE.innerHTML = ''; tbF.innerHTML = '';
        let sE=0, sV=0, sF=0, sL=0;

        produtos.forEach((p, i) => {
            const vds = p.vendidos || 0;
            const fat = vds * p.venda;
            const luc = vds * (p.venda - p.custo);
            sE+=p.qtd; sV+=vds; sF+=fat; sL+=luc;

            tbE.innerHTML += `<tr>
                <td><div class="item-brand"><div class="brand-frame"><img src="${p.logo}" class="brand-img"></div><span>${p.nome}</span></div></td>
                <td>${p.qtd}</td>
                <td><div class="selector"><button class="btn-step" onclick="ajustar(${i}, '-')">-</button><div class="val-vendas">${vds}</div><button class="btn-step plus" onclick="ajustar(${i}, '+')">+</button></div></td>
                <td><button onclick="excluir(${i})" style="border:none; background:none">🗑️</button></td>
            </tr>`;
            
            tbF.innerHTML += `<tr><td>${p.nome}</td><td>${vds} un</td><td style="color:var(--success)">R$ ${luc.toFixed(2)}</td></tr>`;
        });

        document.getElementById('d-est').innerText = sE;
        document.getElementById('d-ven').innerText = sV;
        document.getElementById('d-fat').innerText = `R$ ${sF.toFixed(0)}`;
        document.getElementById('d-luc').innerText = `R$ ${sL.toFixed(0)}`;
    }

    window.excluir = (i) => { if(confirm("Excluir?")) { produtos.splice(i, 1); set(ref(db, 'produtos'), produtos); }};
</script>
</body>
</html>
