<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AM BEBIDAS - Gestão Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- CSS BASE (MANTIDO DO SEU ORIGINAL) --- */
        :root {
            --primary: #4f46e5; --danger: #ef4444; --success: #10b981;
            --bg-body: #f1f5f9; --bg-panel: white; --text-main: #1e293b;
            --text-sub: #64748b; --border: #e2e8f0;
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
        [data-theme="dark"] {
            --bg-body: #0f172a; --bg-panel: #1e293b; --text-main: #f8fafc;
            --text-sub: #94a3b8; --border: #334155;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-body); margin: 0; padding: 15px;
            color: var(--text-main); transition: 0.3s; overflow-x: hidden;
        }

        /* --- AJUSTES PARA LIMPAR A TELA (SIDEBAR) --- */
        #inventory-sidebar {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100%;
            background: var(--bg-body); z-index: 10000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.2); display: flex; flex-direction: column;
        }
        #inventory-sidebar.open { right: 0; }
        @media (min-width: 768px) { #inventory-sidebar { width: 500px; } }

        .sidebar-header { padding: 20px; background: var(--bg-panel); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px; }

        /* --- ESTILOS DE ELEMENTOS (ORIGINAIS ADAPTADOS) --- */
        .container { max-width: 1200px; margin: auto; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .logo-text { font-size: 22px; font-weight: 800; background: var(--bg-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .card { background: var(--bg-panel); padding: 15px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card h3 { margin: 0; font-size: 10px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
        .card p { margin: 5px 0 0; font-size: 18px; font-weight: 800; }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: 1px solid var(--border); background: var(--bg-panel); border-radius: 12px; font-size: 11px; font-weight: 800; color: var(--text-sub); white-space: nowrap; cursor: pointer; }
        .tab-btn.active { background: var(--bg-gradient); color: white; border: none; }

        .panel { background: var(--bg-panel); padding: 20px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        /* Inputs Otimizados para Touch */
        input { 
            width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px; 
            margin-bottom: 12px; background: var(--bg-body); color: var(--text-main); font-size: 16px; box-sizing: border-box; 
        }
        label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 5px; color: var(--text-sub); }

        .btn-main { width: 100%; padding: 16px; border: none; border-radius: 14px; color: white; font-weight: 800; background: var(--bg-gradient); cursor: pointer; font-size: 14px; }
        .btn-float { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }

        /* Estilo da Tabela no Sidebar */
        .item-row { 
            background: var(--bg-panel); padding: 15px; border-radius: 16px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 12px; border: 1px solid var(--border);
        }
        .brand-frame { width: 50px; height: 50px; border-radius: 12px; background: white; flex-shrink: 0; border: 1px solid var(--border); padding: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .brand-frame img { width: 100%; height: 100%; object-fit: contain; }
        .item-info { flex: 1; overflow: hidden; }
        .item-info h4 { margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-info span { font-size: 12px; color: var(--text-sub); }

        .selector { display: flex; align-items: center; gap: 10px; background: var(--bg-body); padding: 6px; border-radius: 10px; }
        .btn-step { width: 32px; height: 32px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; background: var(--bg-panel); color: var(--text-main); }

        .hidden { display: none !important; }

        /* Login Screen Otimizado */
        #login-screen { position: fixed; inset: 0; background: var(--bg-body); display: flex; align-items: center; justify-content: center; z-index: 20000; }
        .login-card { background: var(--bg-panel); padding: 30px; border-radius: 30px; text-align: center; width: 90%; max-width: 380px; border: 1px solid var(--border); }
    </style>
</head>
<body data-theme="light">

    <div id="login-screen">
        <div class="login-card">
            <span style="font-size: 40px;">🍹</span>
            <h2>AM BEBIDAS</h2>
            <div id="box-login">
                <input type="email" id="l-email" placeholder="E-mail">
                <input type="password" id="l-senha" placeholder="Senha">
                <button class="btn-main" onclick="window.logar()">ENTRAR NO SISTEMA</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        
        <div id="inventory-sidebar">
            <div class="sidebar-header">
                <h3 style="margin:0">📦 Inventário Ativo</h3>
                <button onclick="toggleInventory()" style="background:none; border:none; font-size:28px; color:var(--danger)">✕</button>
            </div>
            <div class="sidebar-content" id="corpo-tabela">
                </div>
        </div>

        <div class="container">
            <header>
                <span class="logo-text">AM BEBIDAS</span>
                <div style="display:flex; gap:10px">
                    <button class="btn-float" onclick="toggleInventory()">📦 ITENS</button>
                    <button onclick="toggleTheme()" style="background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:10px" id="theme-icon">🌙</button>
                </div>
            </header>

            <div class="dashboard">
                <div class="card"><h3>Estoque</h3><p id="d-est">0</p></div>
                <div class="card"><h3>Vendidos</h3><p id="d-ven">0</p></div>
                <div class="card" style="grid-column: span 2; display: flex; justify-content: space-between; align-items: center;">
                    <div><h3>Faturamento</h3><p id="d-fat" style="color:var(--success)">R$ 0,00</p></div>
                    <div style="text-align: right;"><h3>Lucro Bruto</h3><p id="d-luc" style="color:var(--primary)">R$ 0,00</p></div>
                </div>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" id="btn-t1" onclick="switchTab('cadastro')">➕ NOVO ITEM</button>
                <button class="tab-btn" id="btn-t2" onclick="switchTab('financeiro')">📈 FINANÇAS</button>
                <button class="tab-btn" id="btn-t3" onclick="switchTab('relatorios')">📅 HISTÓRICO</button>
            </div>

            <div id="section-cadastro" class="panel">
                <h4 style="margin-top:0">Configuração do Produto</h4>
                <input type="hidden" id="edit-idx">
                <input type="hidden" id="p-img-base64">
                <input type="hidden" id="p-img-url">
                
                <label>NOME DA BEBIDA</label>
                <input type="text" id="p-nome" placeholder="Ex: Heineken 330ml">
                
                <div style="display:flex; gap:12px">
                    <div style="flex:1"><label>CUSTO (R$)</label><input type="number" id="p-custo" placeholder="0,00"></div>
                    <div style="flex:1"><label>VENDA (R$)</label><input type="number" id="p-venda" placeholder="0,00"></div>
                </div>

                <div style="display:flex; gap:12px">
                    <div style="flex:1"><label>QTD ATUAL</label><input type="number" id="p-qtd" placeholder="0"></div>
                    <div style="flex:1"><label>AVISO MÍN.</label><input type="number" id="p-min" value="5"></div>
                </div>

                <button onclick="abrirBusca()" style="width:100%; background:#10b981; color:white; border:none; padding:14px; border-radius:12px; margin-bottom:12px; font-weight:bold">🔍 BUSCAR FOTO AUTOMÁTICA</button>
                
                <button class="btn-main" onclick="salvar()">CADASTRAR NO SISTEMA</button>
            </div>

            <div id="section-financeiro" class="panel hidden">
                <h4 style="margin:0 0 15px 0">Lucratividade por Item</h4>
                <div id="corpo-financeiro"></div>
            </div>

            <div id="section-relatorios" class="panel hidden">
                <h4 style="margin:0 0 15px 0">Resumo de Períodos</h4>
                <div id="relatorio-periodos" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Configuração Firebase (Sua configuração original)
        const firebaseConfig = {
            apiKey: "AIzaSyBhM8n2Z5A1_mJLiUJBLxzDAV6OaSfWuuo",
            authDomain: "am-bebidas-eb3d5.firebaseapp.com",
            databaseURL: "https://am-bebidas-eb3d5-default-rtdb.firebaseio.com",
            projectId: "am-bebidas-eb3d5",
            appId: "1:377784119257:web:68d6c9b362e5162beaf3c8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        let produtos = [];

        // Auth Check
        window.logar = () => {
            const e = document.getElementById('l-email').value, s = document.getElementById('l-senha').value;
            signInWithEmailAndPassword(auth, e, s).catch(() => alert("Acesso inválido"));
        };

        onAuthStateChanged(auth, user => {
            if(user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                onValue(ref(db, 'produtos'), s => { produtos = s.val() || []; renderizar(); });
            }
        });

        // Interface
        window.toggleInventory = () => document.getElementById('inventory-sidebar').classList.toggle('open');
        
        window.switchTab = (aba) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
            document.getElementById(`section-${aba}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        };

        window.toggleTheme = () => {
            const b = document.body;
            const t = b.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            b.setAttribute('data-theme', t);
            document.getElementById('theme-icon').innerText = t === 'light' ? '🌙' : '☀️';
        };

        // Lógica de Negócio (Adaptada para Mobile)
        window.salvar = () => {
            const idx = document.getElementById('edit-idx').value;
            const item = {
                nome: document.getElementById('p-nome').value,
                custo: parseFloat(document.getElementById('p-custo').value) || 0,
                venda: parseFloat(document.getElementById('p-venda').value) || 0,
                qtd: parseInt(document.getElementById('p-qtd').value) || 0,
                min: parseInt(document.getElementById('p-min').value) || 5,
                logo: document.getElementById('p-img-url').value || `https://ui-avatars.com/api/?name=${document.getElementById('p-nome').value}&background=4f46e5&color=fff`,
                vendidos: idx === "" ? 0 : (produtos[idx].vendidos || 0)
            };
            if(!item.nome) return alert("Nome obrigatório");
            if(idx === "") produtos.push(item); else produtos[idx] = item;
            set(ref(db, 'produtos'), produtos);
            limparForm();
        };

        window.ajustar = (idx, op) => {
            if(op === '+') {
                if(produtos[idx].qtd > 0) {
                    produtos[idx].qtd--;
                    produtos[idx].vendidos++;
                }
            } else {
                if(produtos[idx].vendidos > 0) {
                    produtos[idx].qtd++;
                    produtos[idx].vendidos--;
                }
            }
            set(ref(db, 'produtos'), produtos);
        };

        function renderizar() {
            const corpo = document.getElementById('corpo-tabela');
            const fin = document.getElementById('corpo-financeiro');
            corpo.innerHTML = ""; fin.innerHTML = "";
            let sE=0, sV=0, sF=0, sL=0;

            produtos.forEach((p, i) => {
                const fat = p.vendidos * p.venda;
                const luc = p.vendidos * (p.venda - p.custo);
                sE+=p.qtd; sV+=p.vendidos; sF+=fat; sL+=luc;

                corpo.innerHTML += `
                    <div class="item-row">
                        <div class="brand-frame"><img src="${p.logo}"></div>
                        <div class="item-info"><h4>${p.nome}</h4><span>Estoque: ${p.qtd}</span></div>
                        <div class="selector">
                            <button class="btn-step" onclick="ajustar(${i}, '-')">－</button>
                            <span style="font-weight:800; min-width:20px; text-align:center">${p.vendidos}</span>
                            <button class="btn-step" style="background:var(--primary); color:white" onclick="ajustar(${i}, '+')">＋</button>
                        </div>
                    </div>`;

                fin.innerHTML += `
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:8px">
                        <div><b>${p.nome}</b><br><small>${p.vendidos} un vendidas</small></div>
                        <div style="text-align:right; color:var(--success); font-weight:800">R$ ${luc.toFixed(2)}</div>
                    </div>`;
            });

            document.getElementById('d-est').innerText = sE;
            document.getElementById('d-ven').innerText = sV;
            document.getElementById('d-fat').innerText = `R$ ${sF.toFixed(2)}`;
            document.getElementById('d-luc').innerText = `R$ ${sL.toFixed(2)}`;
        }

        function limparForm() {
            document.querySelectorAll('input').forEach(i => i.value = "");
            document.getElementById('edit-idx').value = "";
        }

        // Função de busca OpenFoodFacts simplificada para o exemplo
        window.abrirBusca = async () => {
            const nome = document.getElementById('p-nome').value;
            if(!nome) return alert("Digite o nome primeiro");
            const res = await fetch(`https://br.openfoodfacts.org/cgi/search.pl?search_terms=${nome}&json=1&page_size=1`);
            const data = await res.json();
            if(data.products[0]) {
                document.getElementById('p-img-url').value = data.products[0].image_front_url;
                alert("Foto encontrada e aplicada!");
            }
        };
    </script>
</body>
</html>
